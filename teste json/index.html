<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas - Toda Chic Modas</title>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #b0e98a;
            padding: 20px;
            color: var(--primary);
        }

        .header-logo-group {
            position: absolute;
            top: 30px;
            left: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            gap: 10px;
        }

        .logo-redonda {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.788);
            background-color: #fff;
        }

        .logo-titulo {
            width: 250px;
            font-size: 30px;
            font-family: cursive;
            background-color: #ffffff;
            color: black;
            text-align: center;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(34, 34, 34, 0.788);
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
        }

        h2,
        h3 {
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input,
        textarea,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--secondary);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .checkbox-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-save {
            background: var(--secondary);
            flex-grow: 1;
        }

        .btn-export {
            background: var(--primary);
        }

        .btn-import {
            background: #7f8c8d;
        }

        .btn-edit {
            background: var(--warning);
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-delete {
            background: var(--danger);
            padding: 6px 10px;
            font-size: 12px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: var(--light);
        }

        .status-pago {
            color: var(--secondary);
            font-weight: bold;
        }

        .status-pendente {
            color: var(--danger);
            font-weight: bold;
        }

        .acerto-acertado {
            color: var(--secondary);
            font-weight: bold;
        }

        .acerto-pendente {
            color: var(--danger);
            font-weight: bold;
        }

        .acoes {
            display: flex;
            gap: 5px;
        }

        .obs-texto {
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            color: #2980b9;
            font-weight: bold;
        }

        .obs-texto:hover {
            text-decoration: underline;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        #busca-cliente {
            border: 2px solid var(--light);
        }

        /* Estilos da Calculadora */
        .calculator {
            position: absolute;
            top: 30px;
            right: 20px;
            background-color: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 300px;
            z-index: 100;
        }

        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .calc-display {
            flex-grow: 1;
            height: 40px;
            background: #fff;
            text-align: right;
            padding: 10px;
            font-size: 24px;
            border-radius: 5px;
            border: none;
            color: #333;
        }

        .btn-toggle-hist {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            line-height: 1;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        #historico-view {
            background-color: #34495e;
            border-radius: 5px;
            padding: 10px;
            height: 200px;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .hist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        #lista-historico {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            font-size: 18px;
            flex-grow: 1;
        }

        #lista-historico li {
            padding: 5px 0;
            border-bottom: 1px solid #465d75;
            word-break: break-all;
        }

        .calc-btn {
            padding: 10px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #34495e;
            color: white;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: #465d75;
        }

        .btn-op {
            background: #f39c12;
        }

        .btn-equal {
            background: #27ae60;
            grid-column: span 2;
        }

        .btn-clear {
            background: #e74c3c;
            grid-column: span 2;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="header-logo-group">
        <img src="../logo.jpeg" alt="Logo" class="logo-redonda">
        <span class="logo-titulo">Toda Chic Modas</span>
    </div>

    <div class="calculator">
        <div class="calc-header">
            <input type="text" id="display" class="calc-display" disabled value="0">
            <button class="btn-toggle-hist" onclick="toggleHistorico()" title="Ver Histórico">🕒</button>
        </div>

        <div id="calc-main-ui">
            <div class="calc-buttons">
                <button class="calc-btn btn-clear" onclick="clearDisplay()">C</button>
                <button class="calc-btn btn-op" onclick="appendToDisplay('%')">%</button>
                <button class="calc-btn btn-op" onclick="appendToDisplay('/')">/</button>

                <button class="calc-btn" onclick="appendToDisplay('7')">7</button>
                <button class="calc-btn" onclick="appendToDisplay('8')">8</button>
                <button class="calc-btn" onclick="appendToDisplay('9')">9</button>
                <button class="calc-btn btn-op" onclick="appendToDisplay('*')">×</button>

                <button class="calc-btn" onclick="appendToDisplay('4')">4</button>
                <button class="calc-btn" onclick="appendToDisplay('5')">5</button>
                <button class="calc-btn" onclick="appendToDisplay('6')">6</button>
                <button class="calc-btn btn-op" onclick="appendToDisplay('-')">-</button>

                <button class="calc-btn" onclick="appendToDisplay('1')">1</button>
                <button class="calc-btn" onclick="appendToDisplay('2')">2</button>
                <button class="calc-btn" onclick="appendToDisplay('3')">3</button>
                <button class="calc-btn btn-op" onclick="appendToDisplay('+')">+</button>

                <button class="calc-btn" onclick="appendToDisplay('0')">0</button>
                <button class="calc-btn" onclick="appendToDisplay('.')">.</button>
                <button class="calc-btn btn-equal" onclick="calculate()">=</button>
            </div>
        </div>

        <div id="historico-view" style="display: none;">
            <div class="hist-header">
                <span>Histórico</span>
            </div>
            <ul id="lista-historico"></ul>
        </div>
    </div>

    <div class="container">
        <h2>Cadastro de Vendas</h2>

        <form id="venda-form">
            <div class="grid-form">
                <input type="text" id="cliente" placeholder="Cliente" required>
                <input type="date" id="data" required>
                <textarea id="item" placeholder="Item comprado" required></textarea>
                <input type="number" id="valor" placeholder="Valor" step="0.01" min="0" required>

                <select id="parcelamento">
                    <option value="À vista">À vista</option>
                    <option value="2x">2x</option>
                    <option value="3x">3x</option>
                    <option value="4x">4x</option>
                </select>

                <div class="checkbox-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="pago" style="width:auto;">
                        <label for="pago">Já está pago?</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="acerto" style="width:auto;">
                        <label for="acerto">Acerto</label>
                    </div>
                </div>

                <textarea id="obs1" class="full-width" placeholder="Observação"></textarea>
            </div>

            <div class="actions-bar">
                <button type="submit" class="btn-save" id="btnSalvar">Salvar Venda</button>
                <button type="button" class="btn-export" onclick="exportarDados()">Exportar JSON</button>
                <input type="file" id="importar-file" style="display:none" accept=".json" onchange="importarDados(event)">
                <button type="button" class="btn-import" onclick="document.getElementById('importar-file').click()">Importar JSON</button>
            </div>
        </form>

        <h3>Vendas Registradas</h3>

        <div class="search-container">
            <input type="text" id="busca-cliente" placeholder="Filtrar por nome do cliente..." oninput="exibirVendas()">
        </div>

        <div class="table-container">
            <table id="vendas-table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Item</th>
                        <th>Valor</th>
                        <th>Parcelamento</th>
                        <th>Status</th>
                        <th>Observação</th>
                        <th>Acerto</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="customModal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color: rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:white; padding:20px; border-radius:12px; max-width:500px; width:90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position:relative; animation: fadeIn 0.3s;">
            <h3 id="modalTitle" style="margin-top:0; color:var(--primary); border-bottom: 2px solid var(--light); padding-bottom:10px;">Detalhes</h3>
            <p id="modalText" style="white-space: pre-wrap; word-wrap: break-word; line-height:1.6; color:#333; margin: 20px 0;"></p>
            <button onclick="fecharModal()" style="background:var(--primary); width:100%; padding:12px; border-radius:6px; color:white; font-weight:bold; border:none; cursor:pointer;">Fechar</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('venda-form');
        const tableBody = document.querySelector('#vendas-table tbody');
        const btnSalvar = document.getElementById('btnSalvar');
        let editandoId = null;

        document.addEventListener('DOMContentLoaded', () => {
            exibirVendas();
            restaurarFormulario();
        });

        function salvarRascunho() {
            const rascunho = obterDadosFormulario();
            localStorage.setItem('rascunhoVenda', JSON.stringify(rascunho));
        }

        function restaurarFormulario() {
            const rascunho = JSON.parse(localStorage.getItem('rascunhoVenda') || 'null');
            if (rascunho) preencherFormulario(rascunho);
        }

        const camposFormulario = ['cliente', 'data', 'item', 'valor', 'parcelamento', 'pago', 'acerto', 'obs1'];
        camposFormulario.forEach(id => {
            const campo = document.getElementById(id);
            if (campo) {
                campo.addEventListener('input', salvarRascunho);
                campo.addEventListener('change', salvarRascunho);
            }
        });

        function obterDadosFormulario() {
            return {
                cliente: document.getElementById('cliente').value.trim(),
                data: document.getElementById('data').value,
                item: document.getElementById('item').value.trim(),
                valor: document.getElementById('valor').value,
                parcelamento: document.getElementById('parcelamento').value,
                pago: document.getElementById('pago').checked,
                acerto: document.getElementById('acerto').checked,
                obs1: document.getElementById('obs1').value.trim()
            };
        }

        function preencherFormulario(venda) {
            document.getElementById('cliente').value = venda.cliente || '';
            document.getElementById('data').value = venda.data || '';
            document.getElementById('item').value = venda.item || '';
            document.getElementById('valor').value = venda.valor || '';
            document.getElementById('parcelamento').value = venda.parcelamento || 'À vista';
            document.getElementById('pago').checked = venda.pago || false;
            document.getElementById('acerto').checked = venda.acerto || false;
            document.getElementById('obs1').value = venda.obs1 || '';
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const venda = { id: editandoId || crypto.randomUUID(), ...obterDadosFormulario() };
            let vendas = JSON.parse(localStorage.getItem('vendas') || '[]');

            if (editandoId) {
                vendas = vendas.map(v => v.id === editandoId ? venda : v);
                editandoId = null;
                btnSalvar.innerHTML = 'Salvar Venda';
            } else {
                vendas.push(venda);
            }

            localStorage.setItem('vendas', JSON.stringify(vendas));
            localStorage.removeItem('rascunhoVenda');
            form.reset();
            document.getElementById('parcelamento').value = 'À vista';
            exibirVendas();
        });

        function exibirVendas() {
            const vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            const termoBusca = document.getElementById('busca-cliente').value.toLowerCase();
            tableBody.innerHTML = '';

            const vendasFiltradas = vendas.filter(v => v.cliente.toLowerCase().includes(termoBusca));

            if (vendasFiltradas.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="9" class="vazio">${termoBusca ? 'Nenhum cliente encontrado.' : 'Nenhuma venda registrada.'}</td></tr>`;
                return;
            }

            vendasFiltradas.sort((a, b) => new Date(b.data) - new Date(a.data));

            vendasFiltradas.forEach(venda => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${venda.cliente}</td>
                    <td>${formatarData(venda.data)}</td>
                    <td><div class="obs-texto" onclick="mostrarObservacao(\`${venda.item}\`, 'Item Comprado')">${venda.item || '-'}</div></td>
                    <td>${formatarMoeda(venda.valor)}</td>
                    <td>${venda.parcelamento}</td>
                    <td class="${venda.pago ? 'status-pago' : 'status-pendente'}">${venda.pago ? 'Pago' : 'Pendente'}</td>
                    <td><div class="obs-texto" onclick="mostrarObservacao(\`${venda.obs1}\`, 'Observação')">${venda.obs1 || '-'}</div></td>
                    <td class="${venda.acerto ? 'acerto-acertado' : 'acerto-pendente'}">${venda.acerto ? 'Acertado' : 'Pendente'}</td>
                    <td>
                        <div class="acoes">
                            <button class="btn-edit" onclick="editarVenda('${venda.id}')">Editar</button>
                            <button class="btn-delete" onclick="removerVenda('${venda.id}')">Excluir</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function mostrarObservacao(texto, titulo) {
            if (!texto || texto === 'undefined') return;
            document.getElementById('modalTitle').textContent = titulo;
            document.getElementById('modalText').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
        }

        function fecharModal() { document.getElementById('customModal').style.display = 'none'; }
        window.onclick = (e) => { if (e.target == document.getElementById('customModal')) fecharModal(); }

        function editarVenda(id) {
            const vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            const venda = vendas.find(v => v.id === id);
            if (!venda) return;
            preencherFormulario(venda);
            editandoId = id;
            btnSalvar.innerHTML = 'Atualizar Venda';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function removerVenda(id) {
            if (confirm('Excluir este registro?')) {
                let vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
                localStorage.setItem('vendas', JSON.stringify(vendas.filter(v => v.id !== id)));
                exibirVendas();
            }
        }

        function formatarMoeda(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function formatarData(d) {
            if (!d) return '-';
            const [ano, mes, dia] = d.split('-');
            return `${dia}/${mes}/${ano.slice(-2)}`;
        }

        // NOVO SISTEMA DE EXPORTAÇÃO JSON
        function exportarDados() {
            const vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            if (vendas.length === 0) return alert('Sem dados.');
            const blob = new Blob([JSON.stringify(vendas, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'vendas.json';
            link.click();
        }

        // NOVO SISTEMA DE IMPORTAÇÃO JSON
        function importarDados(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    if (confirm('Substituir dados atuais?')) {
                        localStorage.setItem('vendas', JSON.stringify(dados));
                        exibirVendas();
                        alert('Importado com sucesso!');
                    }
                } catch (err) { alert('Erro no arquivo JSON.'); }
            };
            reader.readAsText(arquivo);
        }

        // Calculadora
        const display = document.getElementById('display');
        let historicoContas = JSON.parse(localStorage.getItem('historicoCalculadora') || '[]');

        function appendToDisplay(i) { display.value === "0" ? display.value = i : display.value += i; }
        function clearDisplay() { display.value = "0"; }
        function calculate() {
            try {
                let exp = display.value;
                let res = eval(exp.replace('%', '/100'));
                display.value = res;
                historicoContas.unshift(`${exp} = ${res}`);
                if (historicoContas.length > 15) historicoContas.pop();
                localStorage.setItem('historicoCalculadora', JSON.stringify(historicoContas));
            } catch (e) { display.value = "Erro"; setTimeout(clearDisplay, 1000); }
        }
        function toggleHistorico() {
            const m = document.getElementById('calc-main-ui'), h = document.getElementById('historico-view'), l = document.getElementById('lista-historico');
            if (h.style.display === 'none') {
                m.style.display = 'none'; h.style.display = 'flex';
                l.innerHTML = historicoContas.map(i => `<li>${i}</li>`).join('') || '<li>Vazio</li>';
            } else { m.style.display = 'block'; h.style.display = 'none'; }
        }
    </script>
</body>
</html>
