<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas - Toda Chic Modas</title>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #b0e98a;
            padding: 20px;
            color: var(--primary);
        }

        /* Grupo da Logo e Calculadora alinhados à esquerda */
        .sidebar-left {
            position: absolute;
            top: 30px;
            left: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .header-logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .logo-redonda {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.788);
            background-color: #fff;
        }

        .logo-titulo {
            width: 250px;
            font-size: 30px;
            font-family: cursive;
            background-color: #ffffff;
            color: black;
            text-align: center;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(34, 34, 34, 0.788);
        }

        /* Estilos da Calculadora (Posicionamento alterado) */
        .calculator {
            background-color: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 300px;
        }

        .container {
            max-width: 1460px;
            margin-left: 380px;
            /* Espaço para a sidebar fixa à esquerda */
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
        }

        h2,
        h3 {
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input,
        textarea,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .checkbox-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-save {
            background: var(--secondary);
            flex-grow: 1;
        }

        .btn-export {
            background: var(--primary);
        }

        .btn-import {
            background: #7f8c8d;
        }

        .btn-edit {
            background: var(--warning);
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-delete {
            background: var(--danger);
            padding: 6px 10px;
            font-size: 12px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: var(--light);
        }

        .status-pago {
            color: var(--secondary);
            font-weight: bold;
        }

        .status-pendente {
            color: var(--danger);
            font-weight: bold;
        }

        .acerto-acertado {
            color: var(--secondary);
            font-weight: bold;
        }

        .acerto-pendente {
            color: var(--danger);
            font-weight: bold;
        }

        .obs-texto {
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            color: #2980b9;
            font-weight: bold;
        }

        .vazio {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        /* Calculadora interna */
        .calc-header {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .calc-display {
            flex-grow: 1;
            height: 40px;
            background: #fff;
            text-align: right;
            padding: 10px;
            font-size: 20px;
            border-radius: 5px;
            color: #333;
        }

        .btn-toggle-hist {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: white;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .calc-btn {
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            background: #34495e;
            color: white;
        }

        .btn-op {
            background: #f39c12;
        }

        .btn-equal {
            background: #27ae60;
            grid-column: span 2;
        }

        .btn-clear {
            background: #e74c3c;
            grid-column: span 2;
        }

        #historico-view {
            background: #34495e;
            padding: 10px;
            height: 180px;
            display: flex;
            flex-direction: column;
            color: white;
            border-radius: 5px;
        }

        #lista-historico {
            list-style: none;
            padding: 0;
            overflow-y: auto;
            font-size: 14px;
        }

        @media (max-width: 1100px) {
            .sidebar-left {
                position: static;
                width: 100%;
                margin-bottom: 20px;
            }

            .container {
                margin-left: auto;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar-left">
        <div class="header-logo-group">
            <img src="../logo.jpeg" alt="Logo" class="logo-redonda">
            <span class="logo-titulo">Toda Chic Modas</span>
        </div>

        <div class="calculator">
            <div class="calc-header">
                <input type="text" id="display" class="calc-display" disabled value="0">
                <button class="btn-toggle-hist" onclick="toggleHistorico()">🕒</button>
            </div>
            <div id="calc-main-ui">
                <div class="calc-buttons">
                    <button class="calc-btn btn-clear" onclick="clearDisplay()">C</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('%')">%</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('/')">/</button>
                    <button class="calc-btn" onclick="appendToDisplay('7')">7</button>
                    <button class="calc-btn" onclick="appendToDisplay('8')">8</button>
                    <button class="calc-btn" onclick="appendToDisplay('9')">9</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('*')">×</button>
                    <button class="calc-btn" onclick="appendToDisplay('4')">4</button>
                    <button class="calc-btn" onclick="appendToDisplay('5')">5</button>
                    <button class="calc-btn" onclick="appendToDisplay('6')">6</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('-')">-</button>
                    <button class="calc-btn" onclick="appendToDisplay('1')">1</button>
                    <button class="calc-btn" onclick="appendToDisplay('2')">2</button>
                    <button class="calc-btn" onclick="appendToDisplay('3')">3</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('+')">+</button>
                    <button class="calc-btn" onclick="appendToDisplay('0')">0</button>
                    <button class="calc-btn" onclick="appendToDisplay('.')">.</button>
                    <button class="calc-btn btn-equal" onclick="calculate()">=</button>
                </div>
            </div>
            <div id="historico-view" style="display: none;">
                <div style="font-weight: bold; margin-bottom: 5px;">Histórico</div>
                <ul id="lista-historico"></ul>
            </div>
        </div>
    </div>

    <div class="container">
        <h2>Cadastro de Vendas</h2>
        <form id="venda-form">
            <div class="grid-form">
                <input type="text" id="cliente" placeholder="Cliente" required>
                <input type="date" id="data">
                <textarea id="item" placeholder="Item comprado" required></textarea>
                <input type="number" id="valor" placeholder="Valor" step="0.01" required>

                <select id="parcelamento">
                    <option value="À vista">À vista</option>
                    <option value="2x">2x</option>
                    <option value="3x">3x</option>
                    <option value="4x">4x</option>
                </select>

                <div class="checkbox-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="pago" style="width:auto;">
                        <label for="pago">Pago?</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="acerto" style="width:auto;">
                        <label for="acerto">Acerto</label>
                    </div>
                </div>
                <textarea id="obs1" class="full-width" placeholder="Observação"></textarea>
            </div>

            <div class="actions-bar">
                <button type="submit" class="btn-save" id="btnSalvar">Salvar Venda</button>
                <button type="button" class="btn-export" onclick="exportarDados()">Exportar JSON</button>
                <input type="file" id="importar-file" style="display:none" accept=".json"
                    onchange="importarDados(event)">
                <button type="button" class="btn-import"
                    onclick="document.getElementById('importar-file').click()">Importar JSON</button>
            </div>
        </form>

        <h3>Vendas Registradas</h3>
        <input type="text" id="busca-cliente" placeholder="Filtrar por cliente..." oninput="exibirVendas()"
            style="margin-bottom: 20px;">

        <div class="table-container">
            <table id="vendas-table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Item</th>
                        <th>Valor</th>
                        <th>Parc.</th>
                        <th>Status</th>
                        <th>Obs.</th>
                        <th>Acerto</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="customModal"
        style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:white; padding:20px; border-radius:12px; max-width:500px; width:90%;">
            <h3 id="modalTitle">Detalhes</h3>
            <p id="modalText" style="white-space: pre-wrap; margin: 20px 0;"></p>
            <button onclick="fecharModal()" style="background:var(--primary); width:100%;">Fechar</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('venda-form');
        const tableBody = document.querySelector('#vendas-table tbody');
        const btnSalvar = document.getElementById('btnSalvar');
        let editandoId = null;

        document.addEventListener('DOMContentLoaded', () => { exibirVendas(); restaurarFormulario(); });

        function obterDadosFormulario() {
            let dataValor = document.getElementById('data').value;
            if (!dataValor) {
                const hoje = new Date();
                dataValor = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
            }
            return {
                cliente: document.getElementById('cliente').value.trim(),
                data: dataValor,
                item: document.getElementById('item').value.trim(),
                valor: document.getElementById('valor').value,
                parcelamento: document.getElementById('parcelamento').value,
                pago: document.getElementById('pago').checked,
                acerto: document.getElementById('acerto').checked,
                obs1: document.getElementById('obs1').value.trim()
            };
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const venda = { id: editandoId || crypto.randomUUID(), ...obterDadosFormulario() };
            let vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            vendas = editandoId ? vendas.map(v => v.id === editandoId ? venda : v) : [...vendas, venda];
            localStorage.setItem('vendas', JSON.stringify(vendas));
            editandoId = null; btnSalvar.innerHTML = 'Salvar Venda';
            form.reset(); exibirVendas();
        });

        function exibirVendas() {
            const vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            const busca = document.getElementById('busca-cliente').value.toLowerCase();
            tableBody.innerHTML = '';
            vendas.filter(v => v.cliente.toLowerCase().includes(busca))
                .sort((a, b) => new Date(b.data) - new Date(a.data))
                .forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${v.cliente}</td>
                        <td>${v.data.split('-').reverse().join('/')}</td>
                        <td><div class="obs-texto" onclick="mostrarModal(\`${v.item}\`, 'Item')">${v.item}</div></td>
                        <td>R$ ${Number(v.valor).toFixed(2)}</td>
                        <td>${v.parcelamento}</td>
                        <td class="${v.pago ? 'status-pago' : 'status-pendente'}">${v.pago ? 'Pago' : 'Pendente'}</td>
                        <td><div class="obs-texto" onclick="mostrarModal(\`${v.obs1}\`, 'Obs')">${v.obs1 || '-'}</div></td>
                        <td class="${v.acerto ? 'acerto-acertado' : 'acerto-pendente'}">${v.acerto ? 'Sim' : 'Não'}</td>
                        <td>
                            <button class="btn-edit" onclick="editarVenda('${v.id}')">Editar</button>
                            <button class="btn-delete" onclick="removerVenda('${v.id}')">Exluir</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
        }

        function editarVenda(id) {
            const v = JSON.parse(localStorage.getItem('vendas')).find(v => v.id === id);
            document.getElementById('cliente').value = v.cliente;
            document.getElementById('data').value = v.data;
            document.getElementById('item').value = v.item;
            document.getElementById('valor').value = v.valor;
            document.getElementById('parcelamento').value = v.parcelamento;
            document.getElementById('pago').checked = v.pago;
            document.getElementById('acerto').checked = v.acerto;
            document.getElementById('obs1').value = v.obs1;
            editandoId = id; btnSalvar.innerHTML = 'Atualizar';
        }

        function removerVenda(id) {
            if (confirm('Excluir?')) {
                const v = JSON.parse(localStorage.getItem('vendas')).filter(v => v.id !== id);
                localStorage.setItem('vendas', JSON.stringify(v)); exibirVendas();
            }
        }

        function exportarDados() {
            const blob = new Blob([localStorage.getItem('vendas')], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vendas.json'; a.click();
        }

        function importarDados(e) {
            const reader = new FileReader();
            reader.onload = (ev) => { localStorage.setItem('vendas', ev.target.result); exibirVendas(); };
            reader.readAsText(e.target.files[0]);
        }

        function mostrarModal(t, tit) { document.getElementById('modalTitle').innerText = tit; document.getElementById('modalText').innerText = t; document.getElementById('customModal').style.display = 'flex'; }
        function fecharModal() { document.getElementById('customModal').style.display = 'none'; }

        // Calculadora
        const disp = document.getElementById('display');
        let hist = JSON.parse(localStorage.getItem('histCalc') || '[]');
        function appendToDisplay(i) { disp.value = disp.value === "0" ? i : disp.value + i; }
        function clearDisplay() { disp.value = "0"; }
        function calculate() {
            try {
                let r = eval(disp.value.replace('%', '/100'));
                hist.unshift(`${disp.value} = ${r}`); hist = hist.slice(0, 10);
                localStorage.setItem('histCalc', JSON.stringify(hist));
                disp.value = r;
            } catch (e) { disp.value = "Erro"; }
        }
        function toggleHistorico() {
            const m = document.getElementById('calc-main-ui'), h = document.getElementById('historico-view');
            if (h.style.display === 'none') {
                m.style.display = 'none'; h.style.display = 'flex';
                document.getElementById('lista-historico').innerHTML = hist.map(i => `<li>${i}</li>`).join('');
            } else { m.style.display = 'block'; h.style.display = 'none'; }
        }
    </script>
</body>

</html>
