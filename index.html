<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vendas - Toda Chic Modas</title>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
            --bg-body: #b0e98a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            color: var(--primary);
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            padding: 20px;
            min-height: 100vh;
        }

        /* BARRA LATERAL */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .header-logo-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .logo-redonda {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            background: #fff;
        }

        .logo-titulo {
            width: 100%;
            font-size: 35px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: white;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* CALCULADORA */
        .calculator {
            background: var(--primary);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .calc-header {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .calc-display {
            flex-grow: 1;
            height: 45px;
            background: #fff;
            text-align: right;
            padding: 10px;
            font-size: 26px;
            border: none;
            border-radius: 6px;
            color: #333;
        }

        .btn-toggle-hist {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: white;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .calc-btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #34495e;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .btn-op {
            background: var(--warning);
        }

        .btn-equal {
            background: var(--secondary);
            grid-column: span 2;
        }

        .btn-clear {
            background: var(--danger);
            grid-column: span 2;
        }

        #historico-view {
            background: #34495e;
            padding: 10px;
            height: 180px;
            display: none;
            flex-direction: column;
            color: white;
            border-radius: 6px;
        }

        #lista-historico {
            list-style: none;
            overflow-y: auto;
            font-size: 14px;
            margin-top: 5px;
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h2,
        h3 {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light);
            padding-bottom: 8px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input,
        textarea,
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
            font-size: 18px;
        }

        input:focus {
            border-color: var(--secondary);
            outline: none;
        }

        #obs1 {
            min-height: 150px;
            resize: vertical;
        }

        textarea#item {
            min-height: 80px;
        }

        .checkbox-row {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #dddddd;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group-right {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-left: solid 2px black;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            padding: 12px 20px;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .btn-save {
            background: var(--secondary);
            flex-grow: 2;
        }

        .btn-clear-form {
            background: #95a5a6;
        }

        .btn-export {
            background: var(--primary);
        }

        .btn-import {
            background: #7f8c8d;
        }

        /* BARRA DE BUSCA */
        .search-panel {
            background: #d2d3d3;
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .search-panel input {
            background: #d2d3d3;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: var(--light);
            position: sticky;
            top: 0;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .bg-pago {
            background: #d4edda;
            color: var(--secondary);
        }

        .bg-pendente {
            background: #f8d7da;
            color: var(--danger);
        }

        .obs-texto {
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            color: #2980b9;
        }

        /* MODAL */
        #customModal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }

        @media (max-width: 900px) {
            body {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: 2;
            }

            .main-content {
                order: 1;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="header-logo-group">
            <img src="logo.jpeg" alt="Logo" class="logo-redonda">
            <span class="logo-titulo">Toda Chic Modas</span>
        </div>

        <div class="calculator">
            <div class="calc-header">
                <input type="text" id="display" class="calc-display" disabled value="0">
                <button class="btn-toggle-hist" onclick="toggleHistorico()" title="Histórico">🕒</button>
            </div>
            <div id="calc-main-ui">
                <div class="calc-buttons">
                    <button class="calc-btn btn-clear" onclick="clearDisplay()">C</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('%')">%</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('/')">/</button>
                    <button class="calc-btn" onclick="appendToDisplay('7')">7</button>
                    <button class="calc-btn" onclick="appendToDisplay('8')">8</button>
                    <button class="calc-btn" onclick="appendToDisplay('9')">9</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('*')">×</button>
                    <button class="calc-btn" onclick="appendToDisplay('4')">4</button>
                    <button class="calc-btn" onclick="appendToDisplay('5')">5</button>
                    <button class="calc-btn" onclick="appendToDisplay('6')">6</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('-')">-</button>
                    <button class="calc-btn" onclick="appendToDisplay('1')">1</button>
                    <button class="calc-btn" onclick="appendToDisplay('2')">2</button>
                    <button class="calc-btn" onclick="appendToDisplay('3')">3</button>
                    <button class="calc-btn btn-op" onclick="appendToDisplay('+')">+</button>
                    <button class="calc-btn" onclick="appendToDisplay('0')">0</button>
                    <button class="calc-btn" onclick="appendToDisplay('.')">.</button>
                    <button class="calc-btn btn-equal" onclick="calculate()">=</button>
                </div>
            </div>
            <div id="historico-view">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-weight: bold; font-size: 28px;">Histórico</span>
                    <button onclick="limparHistorico()"
                        style="background: none; font-size: 18px; color: #bdc3c7;">Limpar</button>
                </div>
                <ul id="lista-historico" style="font-size: 20px;"></ul>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <section class="card">
            <h2>Novo Registro de Venda</h2>
            <form id="venda-form">
                <div class="grid-form">
                    <input type="text" id="cliente" placeholder="Nome do Cliente" required>
                    <input type="date" id="data" title="Data da venda (deixe vazio para hoje)">
                    <textarea id="item" placeholder="Itens comprados" required></textarea>
                    <input type="number" id="valor" placeholder="Valor total (Ex: 100.50)" step="0.01" required>

                    <select id="parcelamento">
                        <option value="À vista">À vista</option>
                        <option value="2x">2x</option>
                        <option value="3x">3x</option>
                        <option value="4x">4x</option>
                    </select>

                    <div class="checkbox-row">
                        <label class="checkbox-group"><input type="checkbox" id="pago">Está pago?</label>
                        <label class="checkbox-group-right"><input type="checkbox" id="acerto">Acerto realizado?</label>
                    </div>
                    <textarea id="obs1" class="full-width"
                        placeholder="Escreva as observações detalhadas aqui..."></textarea>
                </div>

                <div class="actions-bar">
                    <button type="button" class="btn-clear-form" onclick="limparTudo()">Limpar</button>

                    <button type="submit" class="btn-save" id="btnSalvar">Salvar Venda</button>
                    <button type="button" class="btn-export" onclick="exportarDados()">Exportar</button>
                    <input type="file" id="importar-file" style="display:none" accept=".json"
                        onchange="importarDados(event)">
                    <button type="button" class="btn-import"
                        onclick="document.getElementById('importar-file').click()">Importar</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h3>Vendas Registradas</h3>

            <div class="search-panel">
                <input type="text" id="busca-cliente" placeholder="🔍 Digite o nome do cliente para buscar..."
                    oninput="exibirVendas()">
            </div>

            <div class="table-container">
                <table id="vendas-table">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Item</th>
                            <th>Valor</th>
                            <th>Parc.</th>
                            <th>Status</th>
                            <th>Obs.</th>
                            <th>Acerto</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="customModal">
        <div class="modal-content">
            <h3 id="modalTitle">Detalhes</h3>
            <p id="modalText"></p>
            <button onclick="fecharModal()"
                style="background: var(--primary); width: 100%; margin-top: 20px;">Fechar</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('venda-form');
        const tableBody = document.querySelector('#vendas-table tbody');
        const btnSalvar = document.getElementById('btnSalvar');
        let editandoId = null;

        document.addEventListener('DOMContentLoaded', () => {
            exibirVendas();
            restaurarRascunho();
        });

        // PERSISTÊNCIA DE RASCUNHO
        const campos = ['cliente', 'data', 'item', 'valor', 'parcelamento', 'pago', 'acerto', 'obs1'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('change', () => {
                const dados = obterDadosFormulario();
                localStorage.setItem('rascunho_venda', JSON.stringify(dados));
            });
        });

        function restaurarRascunho() {
            const rascunho = JSON.parse(localStorage.getItem('rascunho_venda'));
            if (rascunho && !editandoId) preencherCampos(rascunho);
        }

        function preencherCampos(v) {
            document.getElementById('cliente').value = v.cliente || '';
            document.getElementById('data').value = v.data || '';
            document.getElementById('item').value = v.item || '';
            document.getElementById('valor').value = v.valor || '';
            document.getElementById('parcelamento').value = v.parcelamento || 'À vista';
            document.getElementById('pago').checked = !!v.pago;
            document.getElementById('acerto').checked = !!v.acerto;
            document.getElementById('obs1').value = v.obs1 || '';
        }

        function obterDadosFormulario() {
            let dataV = document.getElementById('data').value;
            if (!dataV) {
                const d = new Date();
                dataV = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }
            return {
                cliente: document.getElementById('cliente').value.trim(),
                data: dataV,
                item: document.getElementById('item').value.trim(),
                valor: document.getElementById('valor').value,
                parcelamento: document.getElementById('parcelamento').value,
                pago: document.getElementById('pago').checked,
                acerto: document.getElementById('acerto').checked,
                obs1: document.getElementById('obs1').value.trim()
            };
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const dados = obterDadosFormulario();
            const venda = { id: editandoId || crypto.randomUUID(), ...dados };

            let vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            if (editandoId) {
                vendas = vendas.map(v => v.id === editandoId ? venda : v);
                editandoId = null;
                btnSalvar.innerHTML = "Salvar Venda";
                btnSalvar.style.background = "var(--secondary)";
            } else {
                vendas.push(venda);
            }

            localStorage.setItem('vendas', JSON.stringify(vendas));
            limparTudo();
            exibirVendas();
        });

        function exibirVendas() {
            const vendas = JSON.parse(localStorage.getItem('vendas') || '[]');
            const busca = document.getElementById('busca-cliente').value.toLowerCase();
            tableBody.innerHTML = '';

            const filtradas = vendas.filter(v => v.cliente.toLowerCase().includes(busca))
                .sort((a, b) => new Date(b.data) - new Date(a.data));

            if (filtradas.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="9" class="vazio">Nenhum registro encontrado.</td></tr>';
            } else {
                filtradas.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${v.cliente}</strong></td>
                        <td>${v.data.split('-').reverse().join('/')}</td>
                        <td><div class="obs-texto" onclick="mostrarModal(\`${v.item}\`,'Itens Comprados')">${v.item}</div></td>
                        <td>R$ ${parseFloat(v.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                        <td>${v.parcelamento}</td>
                        <td><span class="status-badge ${v.pago ? 'bg-pago' : 'bg-pendente'}">${v.pago ? 'Pago' : 'Pendente'}</span></td>
                        <td><div class="obs-texto" onclick="mostrarModal(\`${v.obs1}\`,'Observação')">${v.obs1 || '-'}</div></td>
                        <td><span style="color:${v.acerto ? 'var(--secondary)' : 'var(--danger)'}">${v.acerto ? 'Sim' : 'Não'}</span></td>
                        <td>
                            <button onclick="editarVenda('${v.id}')" style="background:var(--warning); padding:5px 10px; font-size:11px;">Editar</button>
                            <button onclick="removerVenda('${v.id}')" style="background:var(--danger); padding:5px 10px; font-size:11px;">Excluir</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            }
        }

        function editarVenda(id) {
            const v = JSON.parse(localStorage.getItem('vendas')).find(v => v.id === id);
            preencherCampos(v);
            editandoId = id;
            btnSalvar.innerHTML = "Atualizar Registro";
            btnSalvar.style.background = "var(--warning)";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function removerVenda(id) {
            if (confirm('Deseja excluir permanentemente este registro?')) {
                const v = JSON.parse(localStorage.getItem('vendas')).filter(v => v.id !== id);
                localStorage.setItem('vendas', JSON.stringify(v));
                exibirVendas();
            }
        }

        function limparTudo() {
            form.reset();
            localStorage.removeItem('rascunho_venda');
            editandoId = null;
            btnSalvar.innerHTML = "Salvar Venda";
            btnSalvar.style.background = "var(--secondary)";
        }

        function exportarDados() {
            const dados = localStorage.getItem('vendas') || '[]';
            const blob = new Blob([dados], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `vendas_todachic_${new Date().getTime()}.json`;
            a.click();
        }

        function importarDados(e) {
            if (!confirm('Isso substituirá todos os dados atuais. Continuar?')) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const json = JSON.parse(ev.target.result);
                    localStorage.setItem('vendas', JSON.stringify(json));
                    exibirVendas();
                    alert('Importação concluída!');
                } catch (err) { alert('Erro no arquivo JSON.'); }
            };
            reader.readAsText(e.target.files[0]);
        }

        function mostrarModal(txt, tit) {
            if (!txt || txt === 'undefined') return;
            document.getElementById('modalTitle').innerText = tit;
            document.getElementById('modalText').innerText = txt;
            document.getElementById('customModal').style.display = 'flex';
        }
        function fecharModal() { document.getElementById('customModal').style.display = 'none'; }

        // CALCULADORA AJUSTADA
        const disp = document.getElementById('display');
        let historico = JSON.parse(localStorage.getItem('hist_calc') || '[]');

        function appendToDisplay(val) {
            if (disp.value === "0" && val !== ".") disp.value = val;
            else disp.value += val;
        }
        function clearDisplay() { disp.value = "0"; }

        function calculate() {
            try {
                let expressaoOriginal = disp.value;
                let expressaoParaEval = expressaoOriginal;

                if (expressaoParaEval.includes('%')) {
                    // Trata acréscimo (+) ou desconto (-) com percentagem
                    expressaoParaEval = expressaoParaEval.replace(/(\d+(?:\.\d+)?)\s*([\+\-\*\/])\s*(\d+(?:\.\d+)?)%/g, (match, v1, op, v2) => {
                        const n1 = parseFloat(v1);
                        const n2 = parseFloat(v2) / 100;
                        if (op === '+' || op === '-') return `${n1} ${op} (${n1} * ${n2})`;
                        return `${n1} ${op} ${n2}`;
                    });
                    // Trata percentagem isolada
                    expressaoParaEval = expressaoParaEval.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");
                }

                const resultado = eval(expressaoParaEval);
                const resultadoFormatado = Number.isInteger(resultado) ? resultado : parseFloat(resultado.toFixed(2));
                
                disp.value = resultadoFormatado;

                historico.unshift(`${expressaoOriginal} = ${resultadoFormatado}`);
                historico = historico.slice(0, 15);
                localStorage.setItem('hist_calc', JSON.stringify(historico));
            } catch (e) { 
                disp.value = "Erro"; 
                setTimeout(clearDisplay, 1500); 
            }
        }

        function toggleHistorico() {
            const main = document.getElementById('calc-main-ui');
            const view = document.getElementById('historico-view');
            const lista = document.getElementById('lista-historico');

            if (view.style.display === 'none' || view.style.display === '') {
                main.style.display = 'none'; view.style.display = 'flex';
                lista.innerHTML = historico.map(h => `<li>${h}</li>`).join('') || '<li>Vazio</li>';
            } else {
                main.style.display = 'grid'; view.style.display = 'none';
            }
        }
        function limparHistorico() {
            historico = []; localStorage.removeItem('hist_calc');
            document.getElementById('lista-historico').innerHTML = '<li>Vazio</li>';
        }
    </script>
</body>

</html>
